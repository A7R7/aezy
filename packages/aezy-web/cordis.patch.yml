# Aezy browser policy over @deepseek-ai/dsh-web-app. The profile order is
# dsh-base -> aezy/base -> dsh-web-app -> aezy/web, so this is the final shipped
# bundle layer before a user's own profile patch.

- id: tools
  config:
    mode: native

- id: agent-presets
  config:
    default: aezy
    includeUserRoot: true

- id: client-hmr
  disabled: true

- id: code-runtime
  disabled: true

- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: cordis-host-runner
  disabled: true

- id: cordis-client-runner
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-workflow-run
  disabled: true

- id: plugin-inventory
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: ui-agent-preset
  disabled: true

# The official package remains installed through dsh-web-app, but Aezy owns
# the visible product identity through the generic rc.2 brand slots.
- id: ui-brand-official
  disabled: true

- insert:
    - id: aezy-brand
      name: '@aezy/brand'

# Aezy-owned M2 execution boundary. It must be registered before product
# plugins so its pre-execute policy and shared audit service are available.
- insert:
    - id: aezy-security
      name: '@aezy/security'

# Official Codex App Server process/account projection plus a DSH LLM adapter.
# DSH retains Session/Turn/approval truth; Codex retains its Thread and agent loop.
- insert:
    - id: aezy-codex
      name: '@aezy/codex'

# Read-only projection of the authoritative Session event window. It owns no
# loop, history, usage, approval, or control state.
- insert:
    - id: aezy-inspector
      name: '@aezy/inspector'

# Aezy-owned M1 vertical slice. Its Node half exposes a bounded same-origin
# repository read API; its browser half contributes the Changes view through
# the existing DSH client-module and conversation-slot seams.
- insert:
    - id: aezy-project
      name: '@aezy/project'

# Published DSH owns PTY ids, shell selection, sandbox binding, process trees,
# scrollback bounds and cleanup. Aezy contributes only the Session/cwd-fenced
# user transport and the browser view below.
- insert:
    - id: terminal
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-shell
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        shellDialect: !!js "process.platform === 'win32' ? 'pwsh' : 'bash'"

    - id: aezy-terminal
      name: '@aezy/terminal'
