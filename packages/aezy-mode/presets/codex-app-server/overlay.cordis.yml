# This overlay is appended to the immutable alpha runtime's shipped standard
# preset by the external runtime selector. Later Cordis waterfall listeners
# enter first, so this fence observes DSH's final Session model selection after
# `await next()`. The installed DSH package remains the authority for the coding
# surface and its version-specific invariants.

- id: codex-app-server-mode
  name: '@aezy/mode'
  config:
    enforceCodex: true
